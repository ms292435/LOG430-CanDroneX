# CanDroneX — Phase 2 (microservices)
# Seuls la passerelle (8080), Keycloak (8081, pour obtenir un jeton) et la documentation Swagger UI (8082)
# sont publiés sur l'hôte.
# Les microservices et leurs bases ne sont joignables que sur le réseau Docker interne.
name: candronex

services:
  # --- Serveur d'autorisation fourni (realm candronex préconfiguré) -----------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Émetteur (iss) fixe, que le jeton soit obtenu via localhost:8081 ou keycloak:8080
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      CANDRONEX_ADMIN_SECRET: ${CANDRONEX_ADMIN_SECRET}
      CLIENT_MANAGEMENT_SERVICE_SECRET: ${CLIENT_MANAGEMENT_SERVICE_SECRET}
      INSPECTRA_DEMO_SECRET: ${INSPECTRA_DEMO_SECRET}
      AEROTECH_DEMO_SECRET: ${AEROTECH_DEMO_SECRET}
      JETON_COURT_SECRET: ${JETON_COURT_SECRET}
    volumes:
      - ./keycloak/realm-candronex.json:/opt/keycloak/data/import/realm-candronex.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      retries: 20

  # --- Point d'entrée unique des clients B2B ---------------------------------------------------
  api-gateway:
    image: devopsfaith/krakend:2.7.2
    volumes:
      - ./krakend/krakend.json:/etc/krakend/krakend.json:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      keycloak: { condition: service_healthy }
      drone-management-service: { condition: service_started }
      service-ordering-service: { condition: service_started }
      slice-service: { condition: service_started }

  # --- Documentation des API : contrats OpenAPI de docs/openapi (générés depuis le code) ---------
  # « Try it out » appelle la passerelle ; le jeton s'obtient par OAuth2 client credentials ou se colle tel quel.
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.15
    environment:
      URLS: >-
        [{"url": "openapi/api-gateway.yaml", "name": "API Gateway (contrat public)"},
         {"url": "openapi/drone-management-service.yaml", "name": "drone-management-service"},
         {"url": "openapi/service-ordering-service.yaml", "name": "service-ordering-service"},
         {"url": "openapi/slice-service.yaml", "name": "slice-service"}]
      URLS_PRIMARY_NAME: API Gateway (contrat public)
      PERSIST_AUTHORIZATION: "true"
    volumes:
      - ./docs/openapi:/usr/share/nginx/html/openapi:ro
    ports:
      - "${SWAGGER_UI_PORT:-8082}:8080"

  # --- drone-management-service : UC-02 et résolution de l'identité réseau ----------------------
  drone-management-service:
    build:
      context: .
      dockerfile: services/drone-management-service/Dockerfile
    environment:
      ConnectionStrings__Drones: Host=drone-db;Database=drone_management;Username=drone_management;Password=${DRONE_DB_PASSWORD}
      Jwt__Emetteur: http://localhost:8081/realms/candronex
      Jwt__Audience: candronex-api
      Jwt__JwksUrl: http://keycloak:8080/realms/candronex/protocol/openid-connect/certs
    depends_on:
      drone-db: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    restart: unless-stopped
    # pas de "ports:" : joignable uniquement par la passerelle et les autres services

  drone-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: drone_management
      POSTGRES_USER: drone_management
      POSTGRES_PASSWORD: ${DRONE_DB_PASSWORD}
    volumes:
      - drone-db-data:/var/lib/postgresql/data
      - ./services/drone-management-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone_management -d drone_management"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # --- service-ordering-service : catalogue (TMF633) et commandes (UC-04, TMF641) ------------------
  service-ordering-service:
    build:
      context: .
      dockerfile: services/service-ordering-service/Dockerfile
    environment:
      ConnectionStrings__ServiceOrdering: Host=ordering-db;Database=service_ordering;Username=service_ordering;Password=${ORDERING_DB_PASSWORD}
      Jwt__Emetteur: http://localhost:8081/realms/candronex
      Jwt__Audience: candronex-api
      Jwt__JwksUrl: http://keycloak:8080/realms/candronex/protocol/openid-connect/certs
      ServicesDistants__DroneManagementUrl: http://drone-management-service:8080
      ServicesDistants__SliceServiceUrl: http://slice-service:8080
    depends_on:
      ordering-db: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    restart: unless-stopped
    # pas de "ports:" : joignable uniquement par la passerelle

  ordering-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: service_ordering
      POSTGRES_USER: service_ordering
      POSTGRES_PASSWORD: ${ORDERING_DB_PASSWORD}
    volumes:
      - ordering-db-data:/var/lib/postgresql/data
      - ./services/service-ordering-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_ordering -d service_ordering"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # --- slice-service : activation des slices (UC-06, TMF640) et inventaire (TMF638) ----------------
  slice-service:
    build:
      context: .
      dockerfile: services/slice-service/Dockerfile
    environment:
      ConnectionStrings__Slices: Host=slice-db;Database=slice_service;Username=slice_service;Password=${SLICE_DB_PASSWORD};Maximum Pool Size=200
      Jwt__Emetteur: http://localhost:8081/realms/candronex
      Jwt__Audience: candronex-api
      Jwt__JwksUrl: http://keycloak:8080/realms/candronex/protocol/openid-connect/certs
      ServicesDistants__DroneManagementUrl: http://drone-management-service:8080
      # Réseau 5G simulé (MockOpen5GSAdapter, interne au service) : latence par activation et taux d'échec
      MockOpen5GS__LatenceMinMs: ${MOCK_LATENCE_MIN_MS:-300}
      MockOpen5GS__LatenceMaxMs: ${MOCK_LATENCE_MAX_MS:-1500}
      MockOpen5GS__TauxEchec: ${MOCK_TAUX_ECHEC:-0}
      # Au-delà, l'activation échoue (DELAI_DEPASSE) ; activations traitées simultanément au plus
      Activation__DelaiMaxReseau: "00:00:05"
      Processeur__ConcurrenceMax: "500"
    depends_on:
      slice-db: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    restart: unless-stopped
    # pas de "ports:" : joignable uniquement par la passerelle et service-ordering-service

  slice-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slice_service
      POSTGRES_USER: slice_service
      POSTGRES_PASSWORD: ${SLICE_DB_PASSWORD}
    volumes:
      - slice-db-data:/var/lib/postgresql/data
      - ./services/slice-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./services/slice-service/db/mesures:/mesures:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slice_service -d slice_service"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  drone-db-data:
  ordering-db-data:
  slice-db-data:
