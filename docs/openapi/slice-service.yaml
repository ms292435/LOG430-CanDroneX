openapi: 3.0.1
info:
  title: CanDroneX — service-inventory et service-activation
  description: 'Inventaire des services de connectivité des drones (TMF638) et activation des slices sur le réseau 5G (UC-06, TMF640, route interne). Chaque appel exige un jeton Keycloak (client credentials) ; un client ne voit que ses services.'
  version: v1
servers:
  - url: 'http://localhost:{port}'
    description: 'API Gateway (KrakenD), seul point d''entrée des clients B2B'
    variables:
      port:
        default: '8080'
        description: GATEWAY_PORT du fichier .env
paths:
  /api/service-activation/v1/activation:
    post:
      tags:
        - 'Activation (UC-06, TMF640) — interne, non exposée par la passerelle'
      summary: 'Demande l''activation d''un élément de commande (UC-06). La demande est acceptée puis traitée en arrière-plan. Idempotente : redemander le même élément retourne la demande existante, sans nouvelle configuration réseau.'
      parameters:
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeActivationRequete'
            example:
              elementId: abbda7ec-62fc-4d9d-b43d-f0edeffce501
              commandeId: 9b0b35d9-7be8-40f4-b0ec-c0ec7614868e
              droneId: 00000000-0000-0000-0000-000000000231
              action: AJOUTER
              specification: C2_URLLC
              versionSpecification: '1.0'
              caracteristiques:
                - nom: sst
                  valeur: '2'
                - nom: sd
                  valeur: '000001'
                - nom: dnn
                  valeur: c2.candronex
                - nom: 5qi
                  valeur: '82'
                - nom: latenceMaxMs
                  valeur: '10'
                - nom: fiabilite
                  valeur: '99.999'
                - nom: debitMontantMbps
                  valeur: '1'
              acceptedAt: '2026-10-24T21:29:29.536Z'
        required: true
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '202':
          description: 'Demande acceptée ; le service est inscrit à l''inventaire, en activation.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuiviActivationReponse'
              example:
                elementId: abbda7ec-62fc-4d9d-b43d-f0edeffce501
                serviceId: 391f3db0-c60f-4b1d-9759-7ae2975bbd0a
                etat: RECUE
                activatedAt: 
                cause: 
        '200':
          description: 'L''élément avait déjà une demande : son suivi est retourné.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuiviActivationReponse'
              example:
                elementId: abbda7ec-62fc-4d9d-b43d-f0edeffce501
                serviceId: 391f3db0-c60f-4b1d-9759-7ae2975bbd0a
                etat: REUSSIE
                activatedAt: '2026-10-24T21:29:31.409Z'
                cause: 
        '400':
          description: Champ absent ou mal formé.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                instance: /api/service-activation/v1/activation
                errors:
                  AcceptedAt:
                    - The AcceptedAt field is required.
                traceId: 00-4e5f60718293a4b5c6d7e8f90a1b2c3d-8293a4b5c6d7e8f9-00
                correlationId: cmd-0042
        '422':
          description: 'Drone inconnu du client, action non prise en charge ou caractéristiques réseau incomplètes.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc4918#section-11.2
                title: Règle métier non respectée
                status: 422
                detail: Le drone 00000000-0000-0000-0000-000000000500 est introuvable parmi les drones du client.
                instance: /api/service-activation/v1/activation
                traceId: 00-4e5f60718293a4b5c6d7e8f90a1b2c3d-8293a4b5c6d7e8f9-00
                correlationId: cmd-0042
        '503':
          description: Le registre des drones ne répond pas ; rien n'a été enregistré.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.6.4
                title: Service indisponible
                status: 503
                detail: 'Le service drone-management-service est momentanément indisponible. Réessayez la même demande : elle est idempotente.'
                instance: /api/service-activation/v1/activation
                traceId: 00-4e5f60718293a4b5c6d7e8f90a1b2c3d-8293a4b5c6d7e8f9-00
                correlationId: cmd-0042
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
        - 'Activation (UC-06, TMF640) — interne, non exposée par la passerelle'
      summary: 'Suit les activations des éléments demandés, pour les éléments du client seulement.'
      parameters:
        - name: elementId
          in: query
          description: 'Éléments de commande suivis (paramètre répété : ?elementId=...&elementId=...).'
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SuiviActivationReponse'
              example:
                - elementId: abbda7ec-62fc-4d9d-b43d-f0edeffce501
                  serviceId: 391f3db0-c60f-4b1d-9759-7ae2975bbd0a
                  etat: REUSSIE
                  activatedAt: '2026-10-24T21:29:31.409Z'
                  cause: 
                - elementId: a587db15-86d5-43cb-bd22-bcdea78cacb1
                  serviceId: efdb1565-a2e5-4515-97ba-c0c2f94924e1
                  etat: ECHOUEE
                  activatedAt: 
                  cause: 'ECHEC_SIMULE : le cœur 5G simulé a refusé la configuration.'
        '400':
          description: Bad Request
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                instance: /api/service-activation/v1/activation
                errors:
                  elementId:
                    - Indiquez de 1 à 100 éléments à suivre.
                traceId: 00-4e5f60718293a4b5c6d7e8f90a1b2c3d-8293a4b5c6d7e8f9-00
                correlationId: cmd-0042
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/service-inventory/v1/service:
    get:
      tags:
        - 'Inventaire (UC-07, TMF638)'
      summary: 'Liste les services du client, ou ceux d''un de ses drones : l''état de chaque slice est indépendant (UC-07). L''inventaire répond sans interroger le réseau.'
      parameters:
        - name: droneId
          in: query
          description: Limite la liste aux services de ce drone.
          schema:
            type: string
            format: uuid
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceReponse'
              example:
                - id: 391f3db0-c60f-4b1d-9759-7ae2975bbd0a
                  droneId: 00000000-0000-0000-0000-000000000231
                  specification: C2_URLLC
                  caracteristiques:
                    - nom: sst
                      valeur: '2'
                    - nom: sd
                      valeur: '000001'
                    - nom: dnn
                      valeur: c2.candronex
                    - nom: 5qi
                      valeur: '82'
                    - nom: latenceMaxMs
                      valeur: '10'
                    - nom: fiabilite
                      valeur: '99.999'
                    - nom: debitMontantMbps
                      valeur: '1'
                  etat: ACTIF
                  activatedAt: '2026-10-24T21:29:31.409Z'
                  causeEchec: 
                  commandeId: 9b0b35d9-7be8-40f4-b0ec-c0ec7614868e
                  elementId: abbda7ec-62fc-4d9d-b43d-f0edeffce501
                - id: efdb1565-a2e5-4515-97ba-c0c2f94924e1
                  droneId: 00000000-0000-0000-0000-000000000231
                  specification: IMAGERIE_EMBB
                  caracteristiques:
                    - nom: sst
                      valeur: '1'
                    - nom: sd
                      valeur: '000002'
                    - nom: dnn
                      valeur: imagerie.candronex
                    - nom: 5qi
                      valeur: '4'
                    - nom: latenceMaxMs
                      valeur: '100'
                    - nom: fiabilite
                      valeur: '99.9'
                    - nom: debitMontantMbps
                      valeur: '50'
                  etat: EN_ECHEC
                  activatedAt: 
                  causeEchec: 'ECHEC_SIMULE : le cœur 5G simulé a refusé la configuration.'
                  commandeId: 9b0b35d9-7be8-40f4-b0ec-c0ec7614868e
                  elementId: a587db15-86d5-43cb-bd22-bcdea78cacb1
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/service-inventory/v1/service/{serviceId}':
    get:
      tags:
        - 'Inventaire (UC-07, TMF638)'
      summary: Consulte un service de l'inventaire.
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceReponse'
              example:
                id: 391f3db0-c60f-4b1d-9759-7ae2975bbd0a
                droneId: 00000000-0000-0000-0000-000000000231
                specification: C2_URLLC
                caracteristiques:
                  - nom: sst
                    valeur: '2'
                  - nom: sd
                    valeur: '000001'
                  - nom: dnn
                    valeur: c2.candronex
                  - nom: 5qi
                    valeur: '82'
                  - nom: latenceMaxMs
                    valeur: '10'
                  - nom: fiabilite
                    valeur: '99.999'
                  - nom: debitMontantMbps
                    valeur: '1'
                etat: ACTIF
                activatedAt: '2026-10-24T21:29:31.409Z'
                causeEchec: 
                commandeId: 9b0b35d9-7be8-40f4-b0ec-c0ec7614868e
                elementId: abbda7ec-62fc-4d9d-b43d-f0edeffce501
        '404':
          description: 'Service inexistant ou appartenant à un autre client, sans distinction.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: Introuvable
                status: 404
                detail: Aucun service ne correspond à cet identifiant.
                instance: /api/service-inventory/v1/service/391f3db0-c60f-4b1d-9759-7ae2975bbd0a
                traceId: 00-4e5f60718293a4b5c6d7e8f90a1b2c3d-8293a4b5c6d7e8f9-00
                correlationId: cmd-0042
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    CaracteristiqueDto:
      type: object
      properties:
        nom:
          type: string
          nullable: true
        valeur:
          type: string
          nullable: true
      additionalProperties: false
    CaracteristiqueReponse:
      type: object
      properties:
        nom:
          type: string
        valeur:
          type: string
      additionalProperties: false
    DemandeActivationRequete:
      required:
        - acceptedAt
        - action
        - caracteristiques
        - commandeId
        - droneId
        - elementId
        - specification
        - versionSpecification
      type: object
      properties:
        elementId:
          type: string
          format: uuid
        commandeId:
          type: string
          format: uuid
        droneId:
          type: string
          format: uuid
        action:
          minLength: 1
          type: string
          example: AJOUTER
        specification:
          minLength: 1
          type: string
          example: C2_URLLC
        versionSpecification:
          minLength: 1
          type: string
          example: '1.0'
        caracteristiques:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/CaracteristiqueDto'
        acceptedAt:
          type: string
          description: 'Acceptation de la commande : début du délai d''activation mesuré.'
          format: date-time
      additionalProperties: false
      description: Demande d'activation d'un élément de commande ; tout ce qu'il faut est figé dans la commande.
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
    ServiceReponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        droneId:
          type: string
          format: uuid
        specification:
          type: string
        caracteristiques:
          type: array
          items:
            $ref: '#/components/schemas/CaracteristiqueReponse'
        etat:
          type: string
        activatedAt:
          type: string
          format: date-time
          nullable: true
        causeEchec:
          type: string
          nullable: true
        commandeId:
          type: string
          format: uuid
        elementId:
          type: string
          format: uuid
      additionalProperties: false
      description: 'Un service de connectivité d''un drone, tel que l''inventaire de CanDroneX le connaît.'
    SuiviActivationReponse:
      type: object
      properties:
        elementId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        etat:
          type: string
        activatedAt:
          type: string
          format: date-time
          nullable: true
        cause:
          type: string
          nullable: true
      additionalProperties: false
      description: 'Suivi d''une activation, tel que service-ordering-service le relit.'
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: { }
  securitySchemes:
    bearer:
      type: http
      description: 'Jeton obtenu auprès de Keycloak (realm candronex), transmis tel quel par la passerelle.'
      scheme: bearer
      bearerFormat: JWT
security:
  - bearer: [ ]
