openapi: 3.0.3
info:
  title: CanDroneX — API Gateway
  description: 'Point d''entrée unique des clients B2B de CanDroneX (KrakenD). Obtenez un jeton auprès du Keycloak fourni (realm candronex) par le flux OAuth2 client credentials, puis présentez-le à chaque appel (Authorization: Bearer). La passerelle valide le jeton et le transmet tel quel ; chaque microservice le revalide (signature, expiration, émetteur, audience candronex-api) et ne donne accès qu''aux ressources du client identifié par la claim azp. Une ressource d''un autre client répond 404, comme une ressource inexistante. Les erreurs des microservices suivent la RFC 9457 (application/problem+json, avec traceId et correlationId). Limite connue : quand un microservice est injoignable, KrakenD CE répond 500 sans corps.'
  version: v1
servers:
  - url: 'http://localhost:{port}'
    description: 'API Gateway (KrakenD), seul point d''entrée des clients B2B'
    variables:
      port:
        default: '8080'
        description: GATEWAY_PORT du fichier .env
paths:
  /api/drone-management/v1/drone:
    post:
      tags:
        - Drones (UC-02)
      summary: Enregistre un drone et son identité réseau pour le client authentifié (UC-02).
      parameters:
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnregistrerDroneRequete'
            example:
              identifiantMetier: DRN-0231
              imsi: '302720100000231'
              typeCarte: SIM
              modele: DJI Matrice 300 RTK
        required: true
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '201':
          description: Drone enregistré ; l'en-tête Location désigne la ressource.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DroneReponse'
              example:
                id: 00000000-0000-0000-0000-000000000231
                identifiantMetier: DRN-0231
                modele: DJI Matrice 300 RTK
                typeCarte: SIM
                statut: ENREGISTRE
                dateEnregistrement: '2026-10-01T12:00:00.0000000+00:00'
        '400':
          description: Champ absent ou mal formé.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                instance: /api/drone-management/v1/drone
                errors:
                  Imsi:
                    - L'IMSI doit contenir 14 ou 15 chiffres.
                  Modele:
                    - Le modèle est obligatoire.
                traceId: 00-75568c0fe45ccfc339bfdb18220b24a8-32eb32f000954802-00
                correlationId: cmd-0042
        '409':
          description: 'IMSI déjà associée à un drone, ou identifiant métier déjà utilisé par ce client.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.10
                title: Conflit
                status: 409
                detail: Cette IMSI est déjà associée à un drone.
                instance: /api/drone-management/v1/drone
                traceId: 00-3d21fd6ac3459aa6d1e44f809a6fcfd6-69b8d71e6969092e-00
                correlationId: cmd-0042
        '422':
          description: Règle métier non respectée.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc4918#section-11.2
                title: Règle métier non respectée
                status: 422
                detail: Le type de carte doit être SIM ou eSIM.
                instance: /api/drone-management/v1/drone
                traceId: 00-1f0c8e2a9b7d4c3e5a6b7c8d9e0f1a2b-3c4d5e6f7a8b9c0d-00
                correlationId: cmd-0042
        '500':
          description: 'Erreur inattendue d''un microservice (Problem Details), ou microservice injoignable : KrakenD CE répond alors 500 sans corps.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
        - Drones (UC-02)
      summary: Liste les drones du client authentifié.
      parameters:
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DroneReponse'
              example:
                - id: 00000000-0000-0000-0000-000000000231
                  identifiantMetier: DRN-0231
                  modele: DJI Matrice 300 RTK
                  typeCarte: SIM
                  statut: ENREGISTRE
                  dateEnregistrement: '2026-10-01T12:00:00.0000000+00:00'
        '500':
          description: 'Erreur inattendue d''un microservice (Problem Details), ou microservice injoignable : KrakenD CE répond alors 500 sans corps.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
