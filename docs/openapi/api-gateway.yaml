                    - nom: fiabilite
                      valeur: '99.999'
                    - nom: debitMontantMbps
                      valeur: '1'
                - id: IMAGERIE_EMBB
                  nom: Imagerie / eMBB
                  description: 'Transmission des images et de la vidéo de mission : débit montant élevé, latence moins critique.'
                  version: '1.0'
                  caracteristiques:
                    - nom: sst
                      valeur: '1'
                    - nom: sd
                      valeur: '000002'
                    - nom: dnn
                      valeur: imagerie.candronex
                    - nom: 5qi
                      valeur: '4'
                    - nom: latenceMaxMs
                      valeur: '100'
                    - nom: fiabilite
                      valeur: '99.9'
                    - nom: debitMontantMbps
                      valeur: '50'
        '500':
          description: 'Erreur inattendue d''un microservice (Problem Details), ou microservice injoignable : KrakenD CE répond alors 500 sans corps.'
