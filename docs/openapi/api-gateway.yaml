  /api/service-ordering/v1/serviceOrder:
    post:
      tags:
        - 'Commandes (UC-04, TMF641)'
      summary: Commande des services de connectivité (UC-04). Chaque élément est ensuite activé sur le réseau (UC-06) ; son état se suit en consultant la commande.
      parameters:
        - name: Idempotency-Key
          in: header
          description: 'Identifiant unique de la demande logique, réutilisé tel quel lors d''un rejeu.'
          required: true
          schema:
            maxLength: 100
            minLength: 1
            type: string
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      requestBody:
        description: Les services demandés.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasserCommandeRequete'
            example:
              elements:
                - droneId: 00000000-0000-0000-0000-000000000231
                  action: AJOUTER
                  specification: C2_URLLC
                - droneId: 00000000-0000-0000-0000-000000000231
                  action: AJOUTER
                  specification: IMAGERIE_EMBB
        required: true
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '201':
          description: Commande acceptée ; l'en-tête Location désigne la ressource.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandeReponse'
              example:
                id: 9b0b35d9-7be8-40f4-b0ec-c0ec7614868e
                etat: EN_COURS
                acceptedAt: '2026-10-24T21:29:29.5360000+00:00'
                elements:
                  - id: abbda7ec-62fc-4d9d-b43d-f0edeffce501
                    droneId: 00000000-0000-0000-0000-000000000231
                    action: AJOUTER
                    specification: C2_URLLC
                    versionSpecification: '1.0'
                    caracteristiques:
                      - nom: sst
                        valeur: '2'
                      - nom: sd
                        valeur: '000001'
                      - nom: dnn
                        valeur: c2.candronex
                      - nom: 5qi
                        valeur: '82'
                      - nom: latenceMaxMs
                        valeur: '10'
                      - nom: fiabilite
                        valeur: '99.999'
                      - nom: debitMontantMbps
                        valeur: '1'
                    etat: EN_ACTIVATION
                    causeEchec: ''
                    serviceId: 391f3db0-c60f-4b1d-9759-7ae2975bbd0a
                    activatedAt: ''
                  - id: a587db15-86d5-43cb-bd22-bcdea78cacb1
                    droneId: 00000000-0000-0000-0000-000000000231
                    action: AJOUTER
                    specification: IMAGERIE_EMBB
                    versionSpecification: '1.0'
                    caracteristiques:
                      - nom: sst
                        valeur: '1'
                      - nom: sd
                        valeur: '000002'
                      - nom: dnn
                        valeur: imagerie.candronex
                      - nom: 5qi
                        valeur: '4'
                      - nom: latenceMaxMs
                        valeur: '100'
                      - nom: fiabilite
                        valeur: '99.9'
                      - nom: debitMontantMbps
                        valeur: '50'
                    etat: EN_ACTIVATION
                    causeEchec: ''
                    serviceId: efdb1565-a2e5-4515-97ba-c0c2f94924e1
                    activatedAt: ''
        '200':
          description: 'Rejeu d''une demande déjà acceptée avec cette clé : la commande existante est retournée.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandeReponse'
              example:
                id: 9b0b35d9-7be8-40f4-b0ec-c0ec7614868e
                etat: COMPLETEE
                acceptedAt: '2026-10-24T21:29:29.5360000+00:00'
                elements:
                  - id: abbda7ec-62fc-4d9d-b43d-f0edeffce501
                    droneId: 00000000-0000-0000-0000-000000000231
                    action: AJOUTER
                    specification: C2_URLLC
                    versionSpecification: '1.0'
                    caracteristiques:
                      - nom: sst
                        valeur: '2'
                      - nom: sd
                        valeur: '000001'
                      - nom: dnn
                        valeur: c2.candronex
                      - nom: 5qi
                        valeur: '82'
                      - nom: latenceMaxMs
                        valeur: '10'
                      - nom: fiabilite
                        valeur: '99.999'
                      - nom: debitMontantMbps
                        valeur: '1'
                    etat: ACTIF
                    causeEchec: ''
                    serviceId: 391f3db0-c60f-4b1d-9759-7ae2975bbd0a
                    activatedAt: '2026-10-24T21:29:31.4090000+00:00'
                  - id: a587db15-86d5-43cb-bd22-bcdea78cacb1
                    droneId: 00000000-0000-0000-0000-000000000231
                    action: AJOUTER
                    specification: IMAGERIE_EMBB
                    versionSpecification: '1.0'
                    caracteristiques:
                      - nom: sst
                        valeur: '1'
                      - nom: sd
                        valeur: '000002'
                      - nom: dnn
                        valeur: imagerie.candronex
                      - nom: 5qi
                        valeur: '4'
                      - nom: latenceMaxMs
                        valeur: '100'
                      - nom: fiabilite
                        valeur: '99.9'
                      - nom: debitMontantMbps
                        valeur: '50'
                    etat: ACTIF
                    causeEchec: ''
                    serviceId: efdb1565-a2e5-4515-97ba-c0c2f94924e1
                    activatedAt: '2026-10-24T21:29:30.6690000+00:00'
        '400':
          description: Champ ou en-tête Idempotency-Key absent ou mal formé.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                instance: /api/service-ordering/v1/serviceOrder
                errors:
                  Idempotency-Key:
                    - L'en-tête Idempotency-Key est obligatoire.
                traceId: 00-6a1b2c3d4e5f60718293a4b5c6d7e8f9-0a1b2c3d4e5f6071-00
                correlationId: cmd-0042
        '409':
          description: Clé d'idempotence déjà utilisée pour une commande au contenu différent.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.10
                title: Conflit
                status: 409
                detail: La clé d'idempotence « demo-0001 » a déjà été utilisée pour une commande au contenu différent.
                instance: /api/service-ordering/v1/serviceOrder
                traceId: 00-3dacc8e1fc179766da8488e6f96bacd7-91b2df23b458810c-00
                correlationId: cmd-0042
        '422':
          description: 'Offre absente du catalogue, drone inconnu, service demandé deux fois pour un drone, action non prise en charge.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
