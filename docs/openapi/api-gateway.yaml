                  nom: C2 / URLLC
                  description: 'Commande, contrôle et télémétrie du drone : faible latence, haute fiabilité, priorité élevée.'
                  version: '1.0'
                  caracteristiques:
                    - nom: sst
                      valeur: '2'
                    - nom: sd
                      valeur: '000001'
                    - nom: dnn
                      valeur: c2.candronex
                    - nom: 5qi
                      valeur: '82'
                    - nom: latenceMaxMs
