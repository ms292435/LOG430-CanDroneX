openapi: 3.0.3
info:
  title: CanDroneX — API Gateway
  description: 'Point d''entrée unique des clients B2B de CanDroneX (KrakenD). Obtenez un jeton auprès du Keycloak fourni (realm candronex) par le flux OAuth2 client credentials, puis présentez-le à chaque appel (Authorization: Bearer). La passerelle valide le jeton et le transmet tel quel ; chaque microservice le revalide (signature, expiration, émetteur, audience candronex-api) et ne donne accès qu''aux ressources du client identifié par la claim azp. Une ressource d''un autre client répond 404, comme une ressource inexistante. Les erreurs des microservices suivent la RFC 9457 (application/problem+json, avec traceId et correlationId). Limite connue : quand un microservice est injoignable, KrakenD CE répond 500 sans corps.'
  version: v1
servers:
  - url: 'http://localhost:{port}'
    description: 'API Gateway (KrakenD), seul point d''entrée des clients B2B'
    variables:
      port:
        default: '8080'
        description: GATEWAY_PORT du fichier .env
paths:
  /api/drone-management/v1/drone:
    post:
      tags:
        - Drones (UC-02)
      summary: Enregistre un drone et son identité réseau pour le client authentifié (UC-02).
      parameters:
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnregistrerDroneRequete'
        required: true
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '201':
          description: Drone enregistré ; l'en-tête Location désigne la ressource.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DroneReponse'
        '400':
          description: Champ absent ou mal formé.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '409':
          description: 'IMSI déjà associée à un drone, ou identifiant métier déjà utilisé par ce client.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Règle métier non respectée.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Erreur inattendue d''un microservice (Problem Details), ou microservice injoignable : KrakenD CE répond alors 500 sans corps.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
        - Drones (UC-02)
      summary: Liste les drones du client authentifié.
      parameters:
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DroneReponse'
        '500':
          description: 'Erreur inattendue d''un microservice (Problem Details), ou microservice injoignable : KrakenD CE répond alors 500 sans corps.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
