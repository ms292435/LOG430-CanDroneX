components:
  schemas:
    DroneReponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        identifiantMetier:
          type: string
        modele:
          type: string
        typeCarte:
          type: string
        statut:
          type: string
        dateEnregistrement:
          type: string
          format: date-time
      additionalProperties: false
      description: 'Drone tel que le client le voit. L''IMSI n''y figure pas : c''est un renseignement personnel, réservé à la résolution d''identité réseau entre services.'
    EnregistrerDroneRequete:
      required:
        - identifiantMetier
        - imsi
        - modele
        - typeCarte
      type: object
      properties:
        identifiantMetier:
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9-]{2,49}$'
          type: string
          description: 'Identifiant choisi par le client, unique parmi ses drones.'
          example: DRN-0231
        imsi:
          minLength: 1
          pattern: '^[0-9]{14,15}$'
          type: string
          description: Identité d'abonné du drone dans le réseau 5G (14 ou 15 chiffres).
          example: '302720100000777'
        typeCarte:
          minLength: 1
          pattern: ^(?i)(sim|esim)$
          type: string
          description: 'Support de l''identité d''abonné : SIM ou eSIM.'
          example: SIM
        modele:
          maxLength: 100
          minLength: 0
          type: string
          example: DJI Matrice 300 RTK
      additionalProperties: false
      description: Demande d'enregistrement d'un drone et de son identité réseau (UC-02).
    IdentiteReseauReponse:
      type: object
      properties:
        droneId:
          type: string
          format: uuid
        imsi:
          type: string
        typeCarte:
          type: string
      additionalProperties: false
      description: 'Identité réseau d''un drone, destinée uniquement au service des slices (UC-06, étape 1).'
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: { }
    CaracteristiqueReponse:
      type: object
      properties:
        nom:
          type: string
        valeur:
          type: string
      additionalProperties: false
    CaracteristiqueSpecificationReponse:
      type: object
      properties:
        nom:
          type: string
        valeur:
          type: string
      additionalProperties: false
    CommandeReponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        etat:
          type: string
        acceptedAt:
          type: string
          format: date-time
        elements:
          type: array
          items:
            $ref: '#/components/schemas/ElementReponse'
      additionalProperties: false
      description: Commande et état global calculé à partir de ses éléments.
    ElementReponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        droneId:
          type: string
          format: uuid
        action:
          type: string
        specification:
          type: string
        versionSpecification:
          type: string
        caracteristiques:
          type: array
          items:
            $ref: '#/components/schemas/CaracteristiqueReponse'
        etat:
          type: string
        causeEchec:
          type: string
          nullable: true
        serviceId:
          type: string
          format: uuid
          nullable: true
        activatedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
      description: 'Élément de commande, avec l''offre figée et l''état de son activation.'
    ElementRequete:
      required:
        - droneId
        - specification
      type: object
      properties:
        droneId:
          type: string
          description: Drone du client concerné par ce service.
          format: uuid
          example: 00000000-0000-0000-0000-000000000231
        action:
          type: string
          description: Opération demandée ; seule AJOUTER est prise en charge en Phase 2. AJOUTER par défaut.
          nullable: true
          example: AJOUTER
        specification:
          minLength: 1
          type: string
          description: Offre du catalogue (serviceSpecification).
          example: C2_URLLC
      additionalProperties: false
      description: Service demandé pour un drone.
    PasserCommandeRequete:
      required:
        - elements
      type: object
      properties:
        elements:
          maxItems: 20
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/ElementRequete'
          description: Un élément par service demandé ; chaque élément désigne son drone.
      additionalProperties: false
      description: Demande de commande de services de connectivité (UC-04).
    SpecificationReponse:
      type: object
      properties:
        id:
          type: string
        nom:
          type: string
        description:
          type: string
        version:
          type: string
        caracteristiques:
          type: array
          items:
            $ref: '#/components/schemas/CaracteristiqueSpecificationReponse'
      additionalProperties: false
      description: Une offre du catalogue et les caractéristiques réseau qui la définissent.
    CaracteristiqueDto:
      type: object
      properties:
        nom:
          type: string
          nullable: true
        valeur:
          type: string
          nullable: true
      additionalProperties: false
    DemandeActivationRequete:
      required:
        - acceptedAt
        - action
        - caracteristiques
        - commandeId
        - droneId
        - elementId
        - specification
        - versionSpecification
      type: object
      properties:
        elementId:
          type: string
          format: uuid
        commandeId:
          type: string
          format: uuid
        droneId:
          type: string
          format: uuid
        action:
          minLength: 1
          type: string
          example: AJOUTER
        specification:
          minLength: 1
          type: string
          example: C2_URLLC
        versionSpecification:
          minLength: 1
          type: string
          example: '1.0'
        caracteristiques:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/CaracteristiqueDto'
        acceptedAt:
          type: string
          description: 'Acceptation de la commande : début du délai d''activation mesuré.'
          format: date-time
      additionalProperties: false
      description: Demande d'activation d'un élément de commande ; tout ce qu'il faut est figé dans la commande.
    ServiceReponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        droneId:
          type: string
          format: uuid
        specification:
          type: string
        caracteristiques:
          type: array
          items:
            $ref: '#/components/schemas/CaracteristiqueReponse'
        etat:
          type: string
        activatedAt:
          type: string
          format: date-time
          nullable: true
        causeEchec:
          type: string
          nullable: true
        commandeId:
          type: string
          format: uuid
        elementId:
          type: string
          format: uuid
      additionalProperties: false
      description: 'Un service de connectivité d''un drone, tel que l''inventaire de CanDroneX le connaît.'
    SuiviActivationReponse:
      type: object
      properties:
        elementId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        etat:
          type: string
        activatedAt:
          type: string
          format: date-time
          nullable: true
        cause:
          type: string
          nullable: true
      additionalProperties: false
      description: 'Suivi d''une activation, tel que service-ordering-service le relit.'
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'Client credentials du client B2B (ex. inspectra-demo), auprès du Keycloak fourni.'
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8081/realms/candronex/protocol/openid-connect/token
          scopes: { }
    bearer:
      type: http
      description: 'Le même jeton, obtenu au préalable (ex. avec curl) et collé tel quel.'
      scheme: bearer
      bearerFormat: JWT
security:
  - oauth2: [ ]
  - bearer: [ ]
