openapi: 3.0.1
info:
  title: CanDroneX — drone-management
  description: Enregistrement des drones et de leur identité réseau (UC-02). Chaque appel exige un jeton Keycloak (client credentials) ; un client ne voit que ses drones.
  version: v1
servers:
  - url: 'http://localhost:{port}'
    description: 'API Gateway (KrakenD), seul point d''entrée des clients B2B'
    variables:
      port:
        default: '8080'
        description: GATEWAY_PORT du fichier .env
paths:
  /api/drone-management/v1/drone:
    post:
      tags:
        - Drones (UC-02)
      summary: Enregistre un drone et son identité réseau pour le client authentifié (UC-02).
      parameters:
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnregistrerDroneRequete'
            example:
              identifiantMetier: DRN-0231
              imsi: '302720100000231'
              typeCarte: SIM
              modele: DJI Matrice 300 RTK
        required: true
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '201':
          description: Drone enregistré ; l'en-tête Location désigne la ressource.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DroneReponse'
              example:
                id: 00000000-0000-0000-0000-000000000231
                identifiantMetier: DRN-0231
                modele: DJI Matrice 300 RTK
                typeCarte: SIM
                statut: ENREGISTRE
                dateEnregistrement: '2026-10-01T12:00:00+00:00'
        '400':
          description: Champ absent ou mal formé.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                instance: /api/drone-management/v1/drone
                errors:
                  Imsi:
                    - L'IMSI doit contenir 14 ou 15 chiffres.
                  Modele:
                    - Le modèle est obligatoire.
                traceId: 00-75568c0fe45ccfc339bfdb18220b24a8-32eb32f000954802-00
                correlationId: cmd-0042
        '409':
          description: 'IMSI déjà associée à un drone, ou identifiant métier déjà utilisé par ce client.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.10
                title: Conflit
                status: 409
                detail: Cette IMSI est déjà associée à un drone.
                instance: /api/drone-management/v1/drone
                traceId: 00-3d21fd6ac3459aa6d1e44f809a6fcfd6-69b8d71e6969092e-00
                correlationId: cmd-0042
        '422':
          description: Règle métier non respectée.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc4918#section-11.2
                title: Règle métier non respectée
                status: 422
                detail: Le type de carte doit être SIM ou eSIM.
                instance: /api/drone-management/v1/drone
                traceId: 00-1f0c8e2a9b7d4c3e5a6b7c8d9e0f1a2b-3c4d5e6f7a8b9c0d-00
                correlationId: cmd-0042
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
        - Drones (UC-02)
      summary: Liste les drones du client authentifié.
      parameters:
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DroneReponse'
              example:
                - id: 00000000-0000-0000-0000-000000000231
                  identifiantMetier: DRN-0231
                  modele: DJI Matrice 300 RTK
                  typeCarte: SIM
                  statut: ENREGISTRE
                  dateEnregistrement: '2026-10-01T12:00:00+00:00'
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/drone-management/v1/drone/{droneId}':
    get:
      tags:
        - Drones (UC-02)
      summary: Consulte un drone du client authentifié.
      parameters:
        - name: droneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DroneReponse'
              example:
                id: 00000000-0000-0000-0000-000000000231
                identifiantMetier: DRN-0231
                modele: DJI Matrice 300 RTK
                typeCarte: SIM
                statut: ENREGISTRE
                dateEnregistrement: '2026-10-01T12:00:00+00:00'
        '404':
          description: 'Drone inexistant ou appartenant à un autre client, sans distinction.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: Introuvable
                status: 404
                detail: Aucun drone ne correspond à cet identifiant.
                instance: /api/drone-management/v1/drone/00000000-0000-0000-0000-000000000500
                traceId: 00-bbaa8bc00500623924fcefd6f869ae50-de3ced1d1c7dc996-00
                correlationId: cmd-0042
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/drone-management/v1/drone/{droneId}/identiteReseau':
    get:
      tags:
        - 'Identité réseau (UC-06) — interne, non exposée par la passerelle'
      summary: 'Résout l''identité réseau d''un drone du client (UC-06, étape 1). Route interne : appelée par slice-service avec le jeton du client, elle n''est pas exposée par la passerelle.'
      parameters:
        - name: droneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentiteReseauReponse'
              example:
                droneId: 00000000-0000-0000-0000-000000000231
                imsi: '302720100000231'
                typeCarte: SIM
        '404':
          description: 'Drone inexistant ou appartenant à un autre client, sans distinction.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: Introuvable
                status: 404
                detail: Aucun drone ne correspond à cet identifiant.
                instance: /api/drone-management/v1/drone/00000000-0000-0000-0000-000000000500/identiteReseau
                traceId: 00-bbaa8bc00500623924fcefd6f869ae50-de3ced1d1c7dc996-00
                correlationId: cmd-0042
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    DroneReponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        identifiantMetier:
          type: string
        modele:
          type: string
        typeCarte:
          type: string
        statut:
          type: string
        dateEnregistrement:
          type: string
          format: date-time
      additionalProperties: false
      description: 'Drone tel que le client le voit. L''IMSI n''y figure pas : c''est un renseignement personnel, réservé à la résolution d''identité réseau entre services.'
    EnregistrerDroneRequete:
      required:
        - identifiantMetier
        - imsi
        - modele
        - typeCarte
      type: object
      properties:
        identifiantMetier:
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9-]{2,49}$'
          type: string
          description: 'Identifiant choisi par le client, unique parmi ses drones.'
          example: DRN-0231
        imsi:
          minLength: 1
          pattern: '^[0-9]{14,15}$'
          type: string
          description: Identité d'abonné du drone dans le réseau 5G (14 ou 15 chiffres).
          example: '302720100000777'
        typeCarte:
          minLength: 1
          pattern: ^(?i)(sim|esim)$
          type: string
          description: 'Support de l''identité d''abonné : SIM ou eSIM.'
          example: SIM
        modele:
          maxLength: 100
          minLength: 0
          type: string
          example: DJI Matrice 300 RTK
      additionalProperties: false
      description: Demande d'enregistrement d'un drone et de son identité réseau (UC-02).
    IdentiteReseauReponse:
      type: object
      properties:
        droneId:
          type: string
          format: uuid
        imsi:
          type: string
        typeCarte:
          type: string
      additionalProperties: false
      description: 'Identité réseau d''un drone, destinée uniquement au service des slices (UC-06, étape 1).'
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: { }
  securitySchemes:
    bearer:
      type: http
      description: 'Jeton obtenu auprès de Keycloak (realm candronex), transmis tel quel par la passerelle.'
      scheme: bearer
      bearerFormat: JWT
security:
  - bearer: [ ]
