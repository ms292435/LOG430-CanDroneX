openapi: 3.0.1
info:
  title: CanDroneX — drone-management
  description: Enregistrement des drones et de leur identité réseau (UC-02). Chaque appel exige un jeton Keycloak (client credentials) ; un client ne voit que ses drones.
  version: v1
servers:
  - url: 'http://localhost:{port}'
    description: 'API Gateway (KrakenD), seul point d''entrée des clients B2B'
    variables:
      port:
        default: '8080'
        description: GATEWAY_PORT du fichier .env
paths:
  /api/drone-management/v1/drone:
    post:
      tags:
        - Drones (UC-02)
      summary: Enregistre un drone et son identité réseau pour le client authentifié (UC-02).
      parameters:
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnregistrerDroneRequete'
        required: true
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '201':
          description: Drone enregistré ; l'en-tête Location désigne la ressource.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DroneReponse'
        '400':
          description: Champ absent ou mal formé.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '409':
          description: 'IMSI déjà associée à un drone, ou identifiant métier déjà utilisé par ce client.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Règle métier non respectée.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
        - Drones (UC-02)
      summary: Liste les drones du client authentifié.
      parameters:
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DroneReponse'
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/drone-management/v1/drone/{droneId}':
    get:
      tags:
        - Drones (UC-02)
      summary: Consulte un drone du client authentifié.
      parameters:
        - name: droneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DroneReponse'
        '404':
          description: 'Drone inexistant ou appartenant à un autre client, sans distinction.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/drone-management/v1/drone/{droneId}/identiteReseau':
    get:
      tags:
        - 'Identité réseau (UC-06) — interne, non exposée par la passerelle'
      summary: 'Résout l''identité réseau d''un drone du client (UC-06, étape 1). Route interne : appelée par slice-service avec le jeton du client, elle n''est pas exposée par la passerelle.'
      parameters:
        - name: droneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentiteReseauReponse'
        '404':
          description: 'Drone inexistant ou appartenant à un autre client, sans distinction.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    DroneReponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        identifiantMetier:
          type: string
        modele:
          type: string
        typeCarte:
          type: string
        statut:
          type: string
        dateEnregistrement:
          type: string
          format: date-time
      additionalProperties: false
      description: 'Drone tel que le client le voit. L''IMSI n''y figure pas : c''est un renseignement personnel, réservé à la résolution d''identité réseau entre services.'
    EnregistrerDroneRequete:
      required:
        - identifiantMetier
        - imsi
        - modele
        - typeCarte
      type: object
      properties:
        identifiantMetier:
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9-]{2,49}$'
          type: string
          description: 'Identifiant choisi par le client, unique parmi ses drones.'
          example: DRN-0231
        imsi:
          minLength: 1
          pattern: '^[0-9]{14,15}$'
          type: string
          description: Identité d'abonné du drone dans le réseau 5G (14 ou 15 chiffres).
          example: '302720100000777'
        typeCarte:
          minLength: 1
          pattern: ^(?i)(sim|esim)$
          type: string
          description: 'Support de l''identité d''abonné : SIM ou eSIM.'
          example: SIM
        modele:
          maxLength: 100
          minLength: 0
          type: string
          example: DJI Matrice 300 RTK
      additionalProperties: false
      description: Demande d'enregistrement d'un drone et de son identité réseau (UC-02).
    IdentiteReseauReponse:
      type: object
      properties:
        droneId:
          type: string
          format: uuid
        imsi:
          type: string
        typeCarte:
          type: string
      additionalProperties: false
      description: 'Identité réseau d''un drone, destinée uniquement au service des slices (UC-06, étape 1).'
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: { }
  securitySchemes:
    bearer:
      type: http
      description: 'Jeton obtenu auprès de Keycloak (realm candronex), transmis tel quel par la passerelle.'
      scheme: bearer
      bearerFormat: JWT
security:
  - bearer: [ ]
