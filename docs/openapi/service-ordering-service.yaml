openapi: 3.0.1
info:
  title: CanDroneX — service-ordering et service-catalog
  description: 'Catalogue des offres de connectivité (TMF633) et commandes de services pour les drones (UC-04, TMF641). Chaque appel exige un jeton Keycloak (client credentials) ; un client ne voit que ses commandes.'
  version: v1
servers:
  - url: 'http://localhost:{port}'
    description: 'API Gateway (KrakenD), seul point d''entrée des clients B2B'
    variables:
      port:
        default: '8080'
        description: GATEWAY_PORT du fichier .env
paths:
  /api/service-catalog/v1/serviceSpecification:
    get:
      tags:
        - 'Catalogue (UC-03, TMF633)'
      summary: 'Liste les offres de connectivité disponibles (C2 / URLLC, Imagerie / eMBB).'
      parameters:
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpecificationReponse'
              example:
                - id: C2_URLLC
                  nom: C2 / URLLC
                  description: 'Commande, contrôle et télémétrie du drone : faible latence, haute fiabilité, priorité élevée.'
                  version: '1.0'
                  caracteristiques:
                    - nom: sst
                      valeur: '2'
                    - nom: sd
                      valeur: '000001'
                    - nom: dnn
                      valeur: c2.candronex
                    - nom: 5qi
                      valeur: '82'
                    - nom: latenceMaxMs
                      valeur: '10'
                    - nom: fiabilite
                      valeur: '99.999'
                    - nom: debitMontantMbps
                      valeur: '1'
                - id: IMAGERIE_EMBB
                  nom: Imagerie / eMBB
                  description: 'Transmission des images et de la vidéo de mission : débit montant élevé, latence moins critique.'
                  version: '1.0'
                  caracteristiques:
                    - nom: sst
                      valeur: '1'
                    - nom: sd
                      valeur: '000002'
                    - nom: dnn
                      valeur: imagerie.candronex
                    - nom: 5qi
                      valeur: '4'
                    - nom: latenceMaxMs
                      valeur: '100'
                    - nom: fiabilite
                      valeur: '99.9'
                    - nom: debitMontantMbps
                      valeur: '50'
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/service-catalog/v1/serviceSpecification/{specificationId}':
    get:
      tags:
        - 'Catalogue (UC-03, TMF633)'
      summary: Consulte une offre du catalogue.
      parameters:
        - name: specificationId
          in: path
          required: true
          schema:
            type: string
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecificationReponse'
              example:
                id: C2_URLLC
                nom: C2 / URLLC
                description: 'Commande, contrôle et télémétrie du drone : faible latence, haute fiabilité, priorité élevée.'
                version: '1.0'
                caracteristiques:
                  - nom: sst
                    valeur: '2'
                  - nom: sd
                    valeur: '000001'
                  - nom: dnn
                    valeur: c2.candronex
                  - nom: 5qi
                    valeur: '82'
                  - nom: latenceMaxMs
                    valeur: '10'
                  - nom: fiabilite
                    valeur: '99.999'
                  - nom: debitMontantMbps
                    valeur: '1'
        '404':
          description: Offre inexistante.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: Introuvable
                status: 404
                detail: Aucune offre ne correspond à cet identifiant.
                instance: /api/service-catalog/v1/serviceSpecification/C2_MMTC
                traceId: 00-3dacc8e1fc179766da8488e6f96bacd7-91b2df23b458810c-00
                correlationId: cmd-0042
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/service-ordering/v1/serviceOrder:
    post:
      tags:
        - 'Commandes (UC-04, TMF641)'
      summary: Commande des services de connectivité (UC-04). Chaque élément est ensuite activé sur le réseau (UC-06) ; son état se suit en consultant la commande.
      parameters:
        - name: Idempotency-Key
          in: header
          description: 'Identifiant unique de la demande logique, réutilisé tel quel lors d''un rejeu.'
          required: true
          schema:
            maxLength: 100
            minLength: 1
            type: string
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      requestBody:
        description: Les services demandés.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasserCommandeRequete'
            example:
              elements:
                - droneId: 00000000-0000-0000-0000-000000000231
                  action: AJOUTER
                  specification: C2_URLLC
                - droneId: 00000000-0000-0000-0000-000000000231
                  action: AJOUTER
                  specification: IMAGERIE_EMBB
        required: true
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '201':
          description: Commande acceptée ; l'en-tête Location désigne la ressource.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandeReponse'
              example:
                id: 9b0b35d9-7be8-40f4-b0ec-c0ec7614868e
                etat: EN_COURS
                acceptedAt: '2026-10-24T21:29:29.536Z'
                elements:
                  - id: abbda7ec-62fc-4d9d-b43d-f0edeffce501
                    droneId: 00000000-0000-0000-0000-000000000231
                    action: AJOUTER
                    specification: C2_URLLC
                    versionSpecification: '1.0'
                    caracteristiques:
                      - nom: sst
                        valeur: '2'
                      - nom: sd
                        valeur: '000001'
                      - nom: dnn
                        valeur: c2.candronex
                      - nom: 5qi
                        valeur: '82'
                      - nom: latenceMaxMs
                        valeur: '10'
                      - nom: fiabilite
                        valeur: '99.999'
                      - nom: debitMontantMbps
                        valeur: '1'
                    etat: EN_ACTIVATION
                    causeEchec: 
                    serviceId: 391f3db0-c60f-4b1d-9759-7ae2975bbd0a
                    activatedAt: 
                  - id: a587db15-86d5-43cb-bd22-bcdea78cacb1
                    droneId: 00000000-0000-0000-0000-000000000231
                    action: AJOUTER
                    specification: IMAGERIE_EMBB
                    versionSpecification: '1.0'
                    caracteristiques:
                      - nom: sst
                        valeur: '1'
                      - nom: sd
                        valeur: '000002'
                      - nom: dnn
                        valeur: imagerie.candronex
                      - nom: 5qi
                        valeur: '4'
                      - nom: latenceMaxMs
                        valeur: '100'
                      - nom: fiabilite
                        valeur: '99.9'
                      - nom: debitMontantMbps
                        valeur: '50'
                    etat: EN_ACTIVATION
                    causeEchec: 
                    serviceId: efdb1565-a2e5-4515-97ba-c0c2f94924e1
                    activatedAt: 
        '200':
          description: 'Rejeu d''une demande déjà acceptée avec cette clé : la commande existante est retournée.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandeReponse'
              example:
                id: 9b0b35d9-7be8-40f4-b0ec-c0ec7614868e
                etat: COMPLETEE
                acceptedAt: '2026-10-24T21:29:29.536Z'
                elements:
                  - id: abbda7ec-62fc-4d9d-b43d-f0edeffce501
                    droneId: 00000000-0000-0000-0000-000000000231
                    action: AJOUTER
                    specification: C2_URLLC
                    versionSpecification: '1.0'
                    caracteristiques:
                      - nom: sst
                        valeur: '2'
                      - nom: sd
                        valeur: '000001'
                      - nom: dnn
                        valeur: c2.candronex
                      - nom: 5qi
                        valeur: '82'
                      - nom: latenceMaxMs
                        valeur: '10'
                      - nom: fiabilite
                        valeur: '99.999'
                      - nom: debitMontantMbps
                        valeur: '1'
                    etat: ACTIF
                    causeEchec: 
                    serviceId: 391f3db0-c60f-4b1d-9759-7ae2975bbd0a
                    activatedAt: '2026-10-24T21:29:31.409Z'
                  - id: a587db15-86d5-43cb-bd22-bcdea78cacb1
                    droneId: 00000000-0000-0000-0000-000000000231
                    action: AJOUTER
                    specification: IMAGERIE_EMBB
                    versionSpecification: '1.0'
                    caracteristiques:
                      - nom: sst
                        valeur: '1'
                      - nom: sd
                        valeur: '000002'
                      - nom: dnn
                        valeur: imagerie.candronex
                      - nom: 5qi
                        valeur: '4'
                      - nom: latenceMaxMs
                        valeur: '100'
                      - nom: fiabilite
                        valeur: '99.9'
                      - nom: debitMontantMbps
                        valeur: '50'
                    etat: ACTIF
                    causeEchec: 
                    serviceId: efdb1565-a2e5-4515-97ba-c0c2f94924e1
                    activatedAt: '2026-10-24T21:29:30.669Z'
        '400':
          description: Champ ou en-tête Idempotency-Key absent ou mal formé.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                instance: /api/service-ordering/v1/serviceOrder
                errors:
                  Idempotency-Key:
                    - L'en-tête Idempotency-Key est obligatoire.
                traceId: 00-6a1b2c3d4e5f60718293a4b5c6d7e8f9-0a1b2c3d4e5f6071-00
                correlationId: cmd-0042
        '409':
          description: Clé d'idempotence déjà utilisée pour une commande au contenu différent.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.10
                title: Conflit
                status: 409
                detail: La clé d'idempotence « demo-0001 » a déjà été utilisée pour une commande au contenu différent.
                instance: /api/service-ordering/v1/serviceOrder
                traceId: 00-3dacc8e1fc179766da8488e6f96bacd7-91b2df23b458810c-00
                correlationId: cmd-0042
        '422':
          description: 'Offre absente du catalogue, drone inconnu, service demandé deux fois pour un drone, action non prise en charge.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc4918#section-11.2
                title: Règle métier non respectée
                status: 422
                detail: Le drone 00000000-0000-0000-0000-000000000500 est introuvable parmi vos drones.
                instance: /api/service-ordering/v1/serviceOrder
                traceId: 00-3dacc8e1fc179766da8488e6f96bacd7-91b2df23b458810c-00
                correlationId: cmd-0042
        '503':
          description: Le registre des drones ne répond pas ; rien n'a été enregistré.
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.6.4
                title: Service indisponible
                status: 503
                detail: Le service drone-management-service est momentanément indisponible. Réessayez avec la même clé d'idempotence.
                instance: /api/service-ordering/v1/serviceOrder
                traceId: 00-3dacc8e1fc179766da8488e6f96bacd7-91b2df23b458810c-00
                correlationId: cmd-0042
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/service-ordering/v1/serviceOrder/{commandeId}':
    get:
      tags:
        - 'Commandes (UC-04, TMF641)'
      summary: 'Suit une commande du client : état global et état de chaque élément (UC-05, UC-06).'
      parameters:
        - name: commandeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Correlation-Id
          in: header
          description: 'Identifiant de corrélation (1 à 128 caractères parmi A-Z a-z 0-9 . _ -), repris dans les journaux de chaque service ; généré s''il est absent ou invalide.'
          schema:
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]{1,128}$'
            type: string
          example: cmd-0042
      responses:
        '401':
          description: 'Jeton absent, mal formé, mal signé, expiré, d''un autre émetteur ou sans l''audience candronex-api.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandeReponse'
              example:
                id: 9b0b35d9-7be8-40f4-b0ec-c0ec7614868e
                etat: PARTIELLE
                acceptedAt: '2026-10-24T21:29:29.536Z'
                elements:
                  - id: abbda7ec-62fc-4d9d-b43d-f0edeffce501
                    droneId: 00000000-0000-0000-0000-000000000231
                    action: AJOUTER
                    specification: C2_URLLC
                    versionSpecification: '1.0'
                    caracteristiques:
                      - nom: sst
                        valeur: '2'
                      - nom: sd
                        valeur: '000001'
                      - nom: dnn
                        valeur: c2.candronex
                      - nom: 5qi
                        valeur: '82'
                      - nom: latenceMaxMs
                        valeur: '10'
                      - nom: fiabilite
                        valeur: '99.999'
                      - nom: debitMontantMbps
                        valeur: '1'
                    etat: ACTIF
                    causeEchec: 
                    serviceId: 391f3db0-c60f-4b1d-9759-7ae2975bbd0a
                    activatedAt: '2026-10-24T21:29:31.409Z'
                  - id: a587db15-86d5-43cb-bd22-bcdea78cacb1
                    droneId: 00000000-0000-0000-0000-000000000231
                    action: AJOUTER
                    specification: IMAGERIE_EMBB
                    versionSpecification: '1.0'
                    caracteristiques:
                      - nom: sst
                        valeur: '1'
                      - nom: sd
                        valeur: '000002'
                      - nom: dnn
                        valeur: imagerie.candronex
                      - nom: 5qi
                        valeur: '4'
                      - nom: latenceMaxMs
                        valeur: '100'
                      - nom: fiabilite
                        valeur: '99.9'
                      - nom: debitMontantMbps
                        valeur: '50'
                    etat: EN_ECHEC
                    causeEchec: 'ECHEC_SIMULE : le cœur 5G simulé a refusé la configuration.'
                    serviceId: efdb1565-a2e5-4515-97ba-c0c2f94924e1
                    activatedAt: 
        '404':
          description: 'Commande inexistante ou appartenant à un autre client, sans distinction.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: Introuvable
                status: 404
                detail: Aucune commande ne correspond à cet identifiant.
                instance: /api/service-ordering/v1/serviceOrder/9b0b35d9-7be8-40f4-b0ec-c0ec7614868e
                traceId: 00-3dacc8e1fc179766da8488e6f96bacd7-91b2df23b458810c-00
                correlationId: cmd-0042
        '500':
          description: 'Erreur inattendue, sans détail interne.'
          headers:
            X-Correlation-Id:
              description: Identifiant de corrélation de la requête.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    CaracteristiqueReponse:
      type: object
      properties:
        nom:
          type: string
        valeur:
          type: string
      additionalProperties: false
    CaracteristiqueSpecificationReponse:
      type: object
      properties:
        nom:
          type: string
        valeur:
          type: string
      additionalProperties: false
    CommandeReponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        etat:
          type: string
        acceptedAt:
          type: string
          format: date-time
        elements:
          type: array
          items:
            $ref: '#/components/schemas/ElementReponse'
      additionalProperties: false
      description: Commande et état global calculé à partir de ses éléments.
    ElementReponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        droneId:
          type: string
          format: uuid
        action:
          type: string
        specification:
          type: string
        versionSpecification:
          type: string
        caracteristiques:
          type: array
          items:
            $ref: '#/components/schemas/CaracteristiqueReponse'
        etat:
          type: string
        causeEchec:
          type: string
          nullable: true
        serviceId:
          type: string
          format: uuid
          nullable: true
        activatedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
      description: 'Élément de commande, avec l''offre figée et l''état de son activation.'
    ElementRequete:
      required:
        - droneId
        - specification
      type: object
      properties:
        droneId:
          type: string
          description: Drone du client concerné par ce service.
          format: uuid
          example: 00000000-0000-0000-0000-000000000231
        action:
          type: string
          description: Opération demandée ; seule AJOUTER est prise en charge en Phase 2. AJOUTER par défaut.
          nullable: true
          example: AJOUTER
        specification:
          minLength: 1
          type: string
          description: Offre du catalogue (serviceSpecification).
          example: C2_URLLC
      additionalProperties: false
      description: Service demandé pour un drone.
    PasserCommandeRequete:
      required:
        - elements
      type: object
      properties:
        elements:
          maxItems: 20
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/ElementRequete'
          description: Un élément par service demandé ; chaque élément désigne son drone.
      additionalProperties: false
      description: Demande de commande de services de connectivité (UC-04).
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
    SpecificationReponse:
      type: object
      properties:
        id:
          type: string
        nom:
          type: string
        description:
          type: string
        version:
          type: string
        caracteristiques:
          type: array
          items:
            $ref: '#/components/schemas/CaracteristiqueSpecificationReponse'
      additionalProperties: false
      description: Une offre du catalogue et les caractéristiques réseau qui la définissent.
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        errors:
          type: object
